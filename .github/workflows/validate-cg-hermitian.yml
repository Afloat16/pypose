name: Validate complex CG inner products
on:
  push:
    branches: [validation/pypose-cg-hermitian-20261116]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch: '2.5.1'
            vision: '0.20.1'
          - torch: '2.6.0'
            vision: '0.21.0'
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.15.3 pytest
          python -m pip install torch==${{ matrix.torch }} torchvision==${{ matrix.vision }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Confirm unchanged-source regression
        run: |
          git diff --exit-code 298e9f0862cb228b0e8851b2616e682ccdca6a32 HEAD -- pypose
          python - <<'PY'
          import json, subprocess, xml.etree.ElementTree as ET
          p = subprocess.run(["python", "-m", "pytest", "-q", "tests/optim/test_solver_complex.py",
                              "--junitxml=cg-baseline.xml"], capture_output=True, text=True)
          print(p.stdout)
          print(p.stderr)
          root = ET.parse("cg-baseline.xml").getroot()
          cases = list(root.iter("testcase"))
          failures = [case.attrib["name"] for case in cases if case.find("failure") is not None]
          errors = [case.attrib["name"] for case in cases if case.find("error") is not None]
          report = {"tests": len(cases), "failures": failures, "errors": errors, "exit_code": p.returncode}
          print("PYPOSE_CG_BASELINE_RESULT=" + json.dumps(report))
          assert p.returncode == 1 and failures and not errors, "Baseline must demonstrate the solver failure"
          PY
      - name: Verify independent Hermitian system and SciPy reference
        run: |
          python - <<'PY'
          import json, numpy as np, torch
          from scipy.sparse.linalg import cg
          from pypose.optim.solver import CG
          report = []
          for dtype in (torch.complex64, torch.complex128):
              A = torch.tensor([[2, 1j], [-1j, 2]], dtype=dtype)
              b = torch.tensor([[1], [1j]], dtype=dtype)
              actual = CG(maxiter=2, tol=1e-6)(A, b)
              expected, info = cg(A.numpy(), b[:, 0].numpy(), rtol=1e-6)
              assert info == 0 and np.allclose(expected, b[:, 0].numpy())
              assert torch.equal(A @ b, b) and torch.equal(b.mT @ b, torch.zeros(1, 1, dtype=dtype))
              assert not actual.isfinite().all()
              report.append({"dtype": str(dtype), "eigenvalues": torch.linalg.eigvalsh(A).tolist(),
                             "bilinear_norm_real": (b.mT @ b).real.item(),
                             "hermitian_norm_real": (b.mH @ b).real.item(),
                             "candidate_finite": bool(actual.isfinite().all()), "scipy_info": info})
          print("PYPOSE_CG_REFERENCE=" + json.dumps(report))
          PY
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit all fork branches and upstream pull request history
        run: python .validation/audit_cg_hermitian_history.py
