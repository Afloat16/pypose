name: Validate IMU rotation reuse
on:
  push:
    branches: [validation/pypose-imu-reuse-20261116]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.5.1', '2.6.0']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          python -m pip install numpy==1.26.4 pytest
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Check exact production source
        run: |
          git diff --exit-code 1f08d19c87272d10fc5b419cf79525e8d31604f5 HEAD -- pypose tests
          python -c "import torch,pypose; print(torch.__version__, pypose.__file__)"
      - name: Full repository suite with seed zero
        run: |
          python - <<'PY'
          import random,numpy,torch,pytest
          random.seed(0);numpy.random.seed(0);torch.manual_seed(0)
          raise SystemExit(pytest.main(['-q']))
          PY
      - name: Native full-update parity and performance
        run: |
          python .validation/benchmark_pypose_imu_reuse.py imu-reuse-results.json
          cat imu-reuse-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imu-reuse-${{ matrix.torch }}
          path: imu-reuse-results.json
