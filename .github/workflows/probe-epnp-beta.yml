name: Investigate EPnP beta coefficient order
on:
  push:
    branches: [validation/epnp-beta-investigation-20261115]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install packaging==25.0
      - name: Compare actual EPnP reprojection paths
        env:
          PYTHONPATH: .
        run: python validation/epnp_beta_probe.py
